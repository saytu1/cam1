plugins {
    id 'com.android.application'
}

android {
    namespace 'com.homecam.blackbox'
    compileSdk 35

    defaultConfig {
        applicationId 'com.homecam.blackbox'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.3.0'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    // 고정 서명 키: 업데이트 설치가 되려면 모든 빌드가 같은 키로 서명되어야 함.
    // CI 에서는 GitHub Secrets 로부터 환경변수로 전달된다.
    def ksFile = System.getenv('SIGNING_KEYSTORE_FILE')
    signingConfigs {
        release {
            if (ksFile != null && file(ksFile).exists()) {
                storeFile file(ksFile)
                storeType 'pkcs12'
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile != null && file(ksFile).exists()) {
                signingConfig signingConfigs.release
            } else {
                // 로컬 테스트용: 키가 없으면 debug 키 (이 APK 는 기존 설치본을 업데이트할 수 없음)
                logger.warn('SIGNING_KEYSTORE_FILE 없음 → debug 키로 서명합니다')
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.herohan:UVCAndroid:1.0.13'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.preference:preference:1.2.1'
    // kotlin-stdlib-jdk7/jdk8 (구버전) 과 kotlin-stdlib 중복 클래스 충돌 방지
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
