name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/UsbHomeCamBlackBox.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsbHomeCamBlackBox-apk
          path: out/*.apk

      # 로그인 없이 휴대폰에서 바로 받을 수 있도록 Releases 에 APK 직접 첨부
      # 고정 주소: https://github.com/<owner>/<repo>/releases/latest/download/UsbHomeCamBlackBox.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" out/UsbHomeCamBlackBox.apk \
            --target "${{ github.sha }}" \
            --title "USB 홈캠 블랙박스 $TAG" \
            --notes "브랜치: ${{ github.ref_name }} / 커밋: ${GITHUB_SHA::7}" \
            --latest
