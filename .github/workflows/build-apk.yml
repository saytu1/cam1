name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 고정 서명 키 준비 (없으면 빌드 중단: 키가 다른 APK 는 업데이트 설치가 실패하기 때문)
      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::GitHub Secrets 에 SIGNING_KEYSTORE_BASE64 가 없습니다. 저장소 Settings > Secrets and variables > Actions 에 서명 키 4개를 등록하세요."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i 'SHA-256'

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/UsbHomeCamBlackBox.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsbHomeCamBlackBox-apk
          path: out/*.apk

      # 로그인 없이 휴대폰에서 바로 받을 수 있도록 Releases 에 APK 직접 첨부
      # 고정 주소: https://github.com/<owner>/<repo>/releases/latest/download/UsbHomeCamBlackBox.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" out/UsbHomeCamBlackBox.apk \
            --target "${{ github.sha }}" \
            --title "USB 홈캠 블랙박스 $TAG" \
            --notes "브랜치: ${{ github.ref_name }} / 커밋: ${GITHUB_SHA::7}" \
            --latest
