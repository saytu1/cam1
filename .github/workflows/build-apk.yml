name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Secrets 가 없을 때 쓰는 debug 서명 키를 캐시에 보관해 빌드끼리 같은 키 재사용
      # (마지막 사용 후 약 7일간 유지 → 그동안은 덮어쓰기 업데이트 가능)
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # 고정 서명 키 준비 (없으면 빌드 중단: 키가 다른 APK 는 업데이트 설치가 실패하기 때문)
      - name: Prepare signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::GitHub Secrets 에 서명 키가 없어 캐시된 debug 키로 서명합니다."
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
          else
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i 'SHA-256'

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/UsbHomeCamBlackBox.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsbHomeCamBlackBox-apk
          path: out/*.apk

      # 로그인 없이 휴대폰에서 바로 받을 수 있도록 Releases 에 APK 직접 첨부
      # 고정 주소: https://github.com/<owner>/<repo>/releases/latest/download/UsbHomeCamBlackBox.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" out/UsbHomeCamBlackBox.apk \
            --target "${{ github.sha }}" \
            --title "USB 홈캠 블랙박스 $TAG" \
            --notes "브랜치: ${{ github.ref_name }} / 커밋: ${GITHUB_SHA::7} / 서명: $([ "$HAS_SIGNING" = true ] && echo 고정 키 || echo '임시 debug 키 - 업데이트 실패 시 앱 삭제 후 재설치')" \
            --latest
